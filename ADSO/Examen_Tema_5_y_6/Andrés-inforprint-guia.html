<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFORPRINT — Guía de burros</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --border2: #333;
  --text: #e8e8e8;
  --muted: #666;
  --accent: #00ff88;
  --accent2: #0099ff;
  --accent3: #ff6b35;
  --win: #0078d4;
  --lnx: #f97316;
  --cli: #8b5cf6;
  --warn: #f59e0b;
  --danger: #ef4444;
  --success: #22c55e;
  --font-mono: 'JetBrains Mono', monospace;
  --font-head: 'Syne', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
}
.header {
  border-bottom: 1px solid var(--border);
  padding: 2rem 2.5rem 1.5rem;
  position: sticky;
  top: 0;
  background: rgba(13,13,13,0.95);
  backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 2rem;
  flex-wrap: wrap;
}
.logo {
  font-family: var(--font-head);
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .05em;
  white-space: nowrap;
}
.logo span { color: var(--muted); font-weight: 400; }
.ptabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.ptab {
  padding: 5px 12px;
  border: 1px solid var(--border2);
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  background: transparent;
  transition: all .15s;
  white-space: nowrap;
}
.ptab:hover { border-color: var(--accent); color: var(--accent); }
.ptab.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: calc(100vh - 80px);
}
.sidebar {
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  position: sticky;
  top: 80px;
  height: calc(100vh - 80px);
  overflow-y: auto;
}
.sidebar-section {
  padding: 0 1rem 1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: .5rem;
}
.sidebar-label {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: .5rem 1rem;
  display: block;
}
.mbtns { display: flex; flex-direction: column; gap: 3px; padding: 0 1rem; }
.mbtn {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  background: transparent;
  text-align: left;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mbtn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
.mbtn.on { border-color: currentColor; }
.mbtn .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.mbtn.win { color: #60a5fa; }
.mbtn.win.on { background: rgba(96,165,250,.1); }
.mbtn.lnx { color: #fb923c; }
.mbtn.lnx.on { background: rgba(251,146,60,.1); }
.mbtn.cli-w { color: #a78bfa; }
.mbtn.cli-w.on { background: rgba(167,139,250,.1); }
.mbtn.cli-l { color: #34d399; }
.mbtn.cli-l.on { background: rgba(52,211,153,.1); }
.content {
  padding: 2rem 2.5rem;
  max-width: 860px;
}
.prac { display: none; }
.prac.on { display: block; }
.mcont { display: none; }
.mcont.on { display: block; }
.blk { margin-bottom: 1.5rem; }
.blk-title {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .5rem;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
pre {
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.65;
  margin-bottom: 6px;
  position: relative;
}
pre .cm { color: #4a5568; }
pre .kw { color: #63b3ed; }
pre .str { color: #68d391; }
pre .fl { color: #f6ad55; }
pre .hl { color: #fc8181; }
.cfg {
  background: #080f1a;
  border: 1px solid #1a2a3a;
  border-radius: 4px;
  padding: 12px 14px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.65;
  margin-bottom: 6px;
  white-space: pre;
}
.cfg .cs { color: #63b3ed; }
.cfg .ck { color: #e2e8f0; }
.cfg .cv { color: #68d391; }
.cfg .cc { color: #4a5568; }
.note {
  padding: 8px 12px;
  border-left: 3px solid;
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  margin-bottom: 6px;
  line-height: 1.5;
}
.ni { border-color: var(--accent2); background: rgba(0,153,255,.06); color: #93c5fd; }
.nw { border-color: var(--warn); background: rgba(245,158,11,.06); color: #fcd34d; }
.nd { border-color: var(--danger); background: rgba(239,68,68,.06); color: #fca5a5; }
.ns { border-color: var(--success); background: rgba(34,197,94,.06); color: #86efac; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 8px;
}
th {
  background: var(--surface2);
  font-weight: 500;
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border2);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
}
tr:last-child td { border-bottom: none; }
td:first-child { color: var(--text); font-family: var(--font-mono); }
.gr { color: var(--success); }
.rd { color: var(--danger); }
.am { color: var(--warn); }
.copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 2px 7px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--muted);
  font-size: 10px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all .15s;
}
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }
.meta {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
  padding: 1rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.meta-val { color: var(--accent); font-weight: 500; }
.separator {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: .75rem 0 .4rem;
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: .75rem;
}
.separator::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
code {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">INFORPRINT <span>// guía de burros</span></div>
  <div class="ptabs" id="ptabs">
    <button class="ptab on" onclick="sp(0)">P1 · Impresión básica</button>
    <button class="ptab" onclick="sp(1)">P2 · Impresoras lógicas</button>
    <button class="ptab" onclick="sp(2)">P3 · Wireshark/Seg.</button>
    <button class="ptab" onclick="sp(3)">P4 · NFS</button>
    <button class="ptab" onclick="sp(4)">P5 · Samba</button>
    <button class="ptab" onclick="sp(5)">P6 · Red mixta</button>
  </div>

<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="content" id="content"></div>
</div>

    0: {
      ws: `<div class="blk"><div class="blk-title">1. Instalar rol de impresión</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button><span class="cm"># PowerShell como Administrador</span>
Install-WindowsFeature Print-Services -IncludeManagementTools
Install-WindowsFeature Web-Server, Web-Mgmt-Tools</pre>

<div class="blk"><div class="blk-title">2. Crear puerto y impresora clawPDF</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button>Add-PrinterPort -Name "CLAWPDF-PORT" -PrinterHostAddress "127.0.0.1" -PortNumber 9100

<pre><button class="copy-btn" onclick="cp(this)">copy</button>New-NetFirewallRule -DisplayName "Allow-SMB-445" -Direction Inbound -Protocol TCP -LocalPort 445 -Action Allow

<pre><button class="copy-btn" onclick="cp(this)">copy</button>sudo apt update && sudo apt install -y cups cups-client cups-pdf

</div>
<div class="blk"><div class="blk-title">2. Editar /etc/cups/cupsd.conf</div>
<div class="note nw">Cambiar <code>Listen localhost:631</code> por el bloque siguiente</div>
<div class="cfg"><span class="cv">Port 631</span>
<span class="cv">ServerAlias *</span>

<span class="cs">&lt;Location /&gt;</span>
  <span class="ck">Order</span> <span class="cv">allow,deny</span>
  <span class="ck">Allow</span> <span class="cv">all</span>
<span class="cs">&lt;/Location&gt;</span>

<span class="cs">&lt;Location /admin&gt;</span>

<span class="cs">&lt;/Location&gt;</span>

<span class="cs">&lt;Location /admin/conf&gt;</span>

  <span class="ck">Require</span> <span class="cv">user @SYSTEM</span>
  <span class="ck">Order</span> <span class="cv">allow,deny</span>
  <span class="ck">Allow</span> <span class="cv">all</span>
<span class="cs">&lt;/Location&gt;</span></div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button>sudo systemctl restart cups
ss -tlnp | grep 631
sudo usermod -aG lpadmin $USER</pre>
</div>
<div class="blk"><div class="blk-title">3. Crear impresora cups-pdf</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button><span class="cm"># Verificar si se creó automáticamente:</span>
lpstat -p
<span class="cm"># Si no aparece, crear manualmente:</span>

  -v cups-pdf:/ \\
  -P /usr/share/ppd/cups-pdf/CUPS-PDF_opt.ppd \\
  -o printer-is-shared=true
sudo cupsenable IMP-LNX-FISICA
sudo cupsaccept IMP-LNX-FISICA
lpstat -p -d</pre>
<div class="note ni">Los PDFs generados se guardan en <code>/var/spool/cups-pdf/</code></div>
</div>
<div class="blk"><div class="blk-title">4. Prueba — usar lp, no lpr</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button>lp -d IMP-LNX-FISICA /etc/hostname

<div class="note nw"><code>lpr -P</code> da "unknown printer" aunque exista. Usar siempre <code>lp -d</code></div>
</div>`,

<pre><button class="copy-btn" onclick="cp(this)">copy</button><span class="cm"># GUI: Ejecutar → \\&lt;IP-WS&gt;\IMP-WS → instala driver automático</span>

</div>

<pre><button class="copy-btn" onclick="cp(this)">copy</button>$p = Get-WmiObject -Query "SELECT * FROM Win32_Printer WHERE ShareName='IMP-WS'"

</div>`,

</div>

lp -d IMP-WS-remota /etc/hostname</pre>

      lnx: `<div class="blk"><div class="blk-title">1. Instalar paquetes y sincronizar reloj — CRÍTICO</div>

  <span class="ck">guest ok</span>    = <span class="cv">no</span></div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button>sudo mkdir -p /srv/samba_direccion /srv/samba_soporte
sudo chmod 770 /srv/samba_direccion /srv/samba_soporte
testparm && sudo systemctl restart smbd</pre>
</div>
<div class="blk"><div class="blk-title">4. Diagnóstico de los 3 fallos intencionados</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button><span class="cm">### FALLO 1: firewall bloqueando Samba</span>
sudo ufw status verbose | grep -E "445|139|137|138"
sudo ufw allow samba   <span class="cm"># 137/udp 138/udp 139/tcp 445/tcp</span>

<span class="cm">### FALLO 2: error en /etc/exports</span>
sudo exportfs -ra      <span class="cm"># muestra errores de sintaxis</span>
sudo journalctl -u nfs-kernel-server -n 30
sudo systemctl status rpcbind
sudo systemctl start rpcbind

<span class="cm">### FALLO 3: resolución de nombres</span>
ping nombre-maquina    <span class="cm"># falla pero ping IP funciona → DNS/hosts</span>
echo "&lt;IP-CLI&gt; cli-lnx" | sudo tee -a /etc/hosts
getent hosts cli-lnx</pre>
</div>
<div class="blk"><div class="blk-title">5. Herramientas obligatorias</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button>ping -c 4 &lt;IP&gt;
ip a && ip route show
systemctl status smbd nfs-kernel-server cups sssd winbind
sudo smbstatus
testparm
showmount -e &lt;IP-SRV&gt;
showmount -a &lt;IP-SRV&gt;
wbinfo -u && wbinfo -g</pre>
</div>`,

      cliw: `<div class="blk"><div class="blk-title">Samba con usuario de dirección</div>
<pre><button class="copy-btn" onclick="cp(this)">copy</button">net use Z: \\\\&lt;IP-SRV&gt;\\direccion /user:ASO\\director1 Usuario.25 /persistent:yes

<span class="cm"># Verificar que soporte1 NO puede entrar a direccion:</span>

<span class="cm"># → System error 5: Access is denied (correcto)</span>

      clil: `<div class="blk"><div class="blk-title">NFS + Samba simultáneo</div>

  -o user=director1,password=Usuario.25,domain=ASO,uid=$(id -u),gid=$(id -g)

};

const mm = { 0: ['ws','lnx','cliw','clil'], 1: ['ws','lnx','cliw','clil'], 2: ['ws','lnx','cliw','clil'], 3: ['lnx','clil'], 4: ['lnx','cliw','clil'], 5: ['lnx','cliw','clil'] };
let cp_idx = 0, cm_idx = 0;

function renderMeta() {
  const m = DATA.meta;
  return `<div class="meta">
    <div class="meta-item"><span class="meta-label">Dominio</span><span class="meta-val">${m.dominio}</span></div>
    <div class="meta-item"><span class="meta-label">Admin AD</span><span class="meta-val">${m.admin}</span></div>
    <div class="meta-item"><span class="meta-label">Contraseña</span><span class="meta-val">${m.pass}</span></div>
    <div class="meta-item"><span class="meta-label">Driver Windows</span><span class="meta-val">${m.driver}</span></div>
  </div>`;
}

function renderSidebar(pIdx) {
  const machines = DATA.pracs[pIdx].machines;
  const labels = { ws: 'WS2022', lnx: 'Ubuntu Server', cliw: 'CLI-WIN', clil: 'CLI-LNX' };
  let html = '<span class="sidebar-label">Máquinas</span><div class="mbtns">';
  machines.forEach((m, i) => {
    html += `<button class="mbtn ${m.cls} ${i===0?'on':''}" onclick="sm('${m.id}', ${pIdx})"><span class="dot"></span>${labels[m.id]}</button>`;
  });
  html += '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

function renderContent(pIdx, mId) {
  const c = DATA.content[pIdx];
  if (!c) { document.getElementById('content').innerHTML = '<p style="color:var(--muted)">Sin contenido</p>'; return; }
  const html = c[mId] || '<p style="color:var(--muted)">Sin contenido para esta máquina</p>';
  document.getElementById('content').innerHTML = renderMeta() + html;
}

function sp(i) {
  cp_idx = i;
  document.querySelectorAll('#ptabs .ptab').forEach((t,j) => t.classList.toggle('on', j===i));
  renderSidebar(i);
  const first = mm[i][0];
  cm_idx = first;
  renderContent(i, first);
}

function sm(mId, pIdx) {
  cm_idx = mId;
  document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('on'));
  event.currentTarget.classList.add('on');
  renderContent(pIdx, mId);
}

function cp(btn) {
  const pre = btn.parentElement;
  const text = pre.innerText.replace('copy','').replace('copied','').trim();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

sp(0);
</script>
</body>
</html>
