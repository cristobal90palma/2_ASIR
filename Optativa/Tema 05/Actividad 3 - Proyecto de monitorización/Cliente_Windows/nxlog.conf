define ROOT C:\Program Files\nxlog
 
Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
Pidfile   %ROOT%\data\nxlog.pid
SpoolDir  %ROOT%\data
LogFile   %ROOT%\data\nxlog.log

###########################################################################
#### EXTENSIONES (Obligatorio para que funcionen las macros de Syslog) ####
###########################################################################
<Extension syslog>
    Module      xm_syslog
</Extension>

#################################
#### MÓDULOS DE ENTRADA      ####
#################################
# Lee el Visor de Eventos de Windows
<Input entrada_eventos>
    Module      im_msvistalog
    Query       <QueryList>\
                    <Query Id="0">\
                        <Select Path="Application">*</Select>\
                        <Select Path="System">*</Select>\
                        <Select Path="Security">*</Select>\
                    </Query>\
                </QueryList>
</Input>
 
#################################
#### MÓDULOS DE SALIDA       ####
#################################
# Convierte y envía los datos en formato Syslog estándar (UDP)
<Output salida_syslog>
    Module      om_udp
    Host        10.2.7.99
    Port        514
    Exec        to_syslog_bsd();
</Output>
 
#################################
#### RUTAS DE CONEXIÓN       ####
#################################
<Route ruta_logs>
    Path        entrada_eventos => salida_syslog
</Route>