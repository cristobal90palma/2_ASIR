services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=12345
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    ports:
      - "9115:9115"
    restart: unless-stopped

  # =========================================================================
  # NUEVOS SERVICIOS PARA LA GESTIÓN DE LOGS (ACTIVIDAD 3)
  # =========================================================================
  
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log # Enlace clave para acceder al ALERTA_TOTAL.log del host
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

# === NUEVO: Exportador nativo para MikroTik (API) ===
  mikrotik-exporter:
    image: ghcr.io/jesof/mikrotik-exporter:latest
    container_name: mikrotik_exporter
    ports:
      - "9094:9090" # Mapeamos su puerto interno al 9094 de la máquina física
    environment:
      - SERVER_ADDR=0.0.0.0:9090
      - ROUTERS_CONFIG=[{"name":"mikrotik-router","address":"10.2.7.3:8728","username":"prometheus","password":"12345"}]
    restart: unless-stopped

volumes:
  grafana-storage:
